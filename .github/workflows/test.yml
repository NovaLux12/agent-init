name: test
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  ci:
    uses: NovaLux12/.github/.github/workflows/go-ci.yml@main
  dogfood:
    name: dogfood (write then validate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - run: go build -ldflags="-s -w" -o dist/agent-init .
      - name: dogfood (write then validate)
        run: |
          ./dist/agent-init \
            --name "CI Test Agent" \
            --handle "@ci@ci.example.com" \
            --description "Generated by CI dogfood." \
            --owner-name "CI Owner" \
            --capability code-generation \
            --capability web-search \
            --runtime openclaw \
            --output /tmp/ci-card.json
          grep -q "CI Test Agent" /tmp/ci-card.json
          grep -q "code-generation" /tmp/ci-card.json
