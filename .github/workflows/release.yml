name: release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true

      # The asset names below are the ones v0.1.1 already published, so they
      # must not change. These are raw binaries, not archives.
      - name: Build
        env:
          CGO_ENABLED: 0
        run: |
          mkdir -p dist
          LDFLAGS="-s -w"
          GOOS=linux  GOARCH=amd64 CGO_ENABLED=0 go build -ldflags "$LDFLAGS" -o dist/agent-init_linux_amd64   .
          GOOS=linux  GOARCH=arm64 CGO_ENABLED=0 go build -ldflags "$LDFLAGS" -o dist/agent-init_linux_arm64   .
          GOOS=darwin GOARCH=amd64 CGO_ENABLED=0 go build -ldflags "$LDFLAGS" -o dist/agent-init_darwin_amd64  .
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build -ldflags "$LDFLAGS" -o dist/agent-init_darwin_arm64  .
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -ldflags "$LDFLAGS" -o dist/agent-init_windows_amd64.exe .
          GOOS=windows GOARCH=arm64 CGO_ENABLED=0 go build -ldflags "$LDFLAGS" -o dist/agent-init_windows_arm64.exe .

      - name: Checksums
        run: |
          cd dist
          sha256sum agent-init_* > SHA256SUMS

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/agent-init_linux_amd64
            dist/agent-init_linux_arm64
            dist/agent-init_darwin_amd64
            dist/agent-init_darwin_arm64
            dist/agent-init_windows_amd64.exe
            dist/agent-init_windows_arm64.exe
            dist/SHA256SUMS
          generate_release_notes: true
